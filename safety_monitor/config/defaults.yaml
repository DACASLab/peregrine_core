/**:
  ros__parameters:
    evaluate_rate_hz: 2.0
    command_land_enabled: true
    auto_start: true

    battery:
      enabled: true
      warn_pct: 0.25
      critical_pct: 0.15
      emergency_pct: 0.10
      min_voltage: 10.0
      warn_grace_s: 5.0
      critical_grace_s: 2.0
    gps:
      enabled: true
      min_fix_type: 3
      max_hdop: 5.0
      max_vdop: 5.0
      min_satellites: 6
      freshness_timeout_s: 2.0
      warn_grace_s: 5.0
      critical_grace_s: 3.0
    geofence:
      enabled: true
      max_radius_m: 500.0
      max_altitude_m: 120.0
      min_altitude_m: -5.0
      warn_grace_s: 3.0
      critical_grace_s: 1.0
    envelope:
      enabled: true
      max_velocity_ms: 15.0
      max_altitude_m: 120.0
      max_tilt_rad: 0.7
      warn_grace_s: 3.0
      critical_grace_s: 1.0

    healthy_auto_clear_s: 3.0
    land_command_timeout_s: 5.0
    land_command_retry_count: 3
