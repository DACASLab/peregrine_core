frame_transforms:
  frame_prefix:
    type: string
    default_value: ""
    description: "TF frame name prefix for multi-UAV (e.g. uav1)"
    read_only: true

  odometry_topic:
    type: string
    default_value: "odometry"
    description: "Odometry input topic name"
    read_only: true

  frame_anchor_topic:
    type: string
    default_value: "frame_anchor"
    description: "FrameAnchor input topic (from hardware_abstraction)"
    read_only: true

  world_frame:
    type: string
    default_value: "world"
    description: "Shared, fleet-wide world frame (NOT namespaced)"
    read_only: true

  map_frame:
    type: string
    default_value: "map"
    description: "Per-UAV map frame (prefixed with frame_prefix). EKF origin placed in world."
    read_only: true

  odom_frame:
    type: string
    default_value: "odom"
    description: "Vehicle-local odom frame (prefixed with frame_prefix)"
    read_only: true

  base_link_frame:
    type: string
    default_value: "base_link"
    description: "Vehicle-local base link frame (prefixed with frame_prefix)"
    read_only: true

  base_link_frd_frame:
    type: string
    default_value: "base_link_frd"
    description: "Vehicle-local FRD body frame (prefixed with frame_prefix)"
    read_only: true

  publish_rate_hz:
    type: double
    default_value: 100.0
    description: "TF broadcast publication rate"
    read_only: true
    validation:
      gt<>: [0.0]

  world_datum_set:
    type: bool
    default_value: false
    description: "If true, place this UAV's map in world using world_datum_*; else world==map horizontally."
    read_only: true

  world_datum_lat:
    type: double
    default_value: 0.0
    description: "Shared fleet world-datum latitude (deg). Must match hardware_abstraction and the fleet."
    read_only: true

  world_datum_lon:
    type: double
    default_value: 0.0
    description: "Shared fleet world-datum longitude (deg). Must match hardware_abstraction and the fleet."
    read_only: true

  world_datum_alt:
    type: double
    default_value: 0.0
    description: "Shared fleet world-datum altitude (AMSL m). Must match hardware_abstraction and the fleet."
    read_only: true
