/**:
  ros__parameters:
    takeoff_altitude_m: 5.0
    climb_velocity_mps: 1.0
    landing_descent_velocity_mps: 0.8

    # Default sequence for classical step-response tuning.
    step_sequence: "x+,x-,y+,y-,z+,z-,yaw+,yaw-"
    lateral_step_m: 1.0
    vertical_step_m: 0.75
    yaw_step_deg: 20.0
    pre_step_hold_s: 2.0
    post_step_hold_s: 8.0
    inter_step_pause_s: 1.0

    preflight_wait_s: 30.0
    post_ready_wait_s: 5.0
    server_wait_s: 20.0
    action_timeout_s: 240.0
