/**:
  ros__parameters:
    takeoff_altitude_m: 5.0
    climb_velocity_mps: 1.0
    landing_descent_velocity_mps: 0.8

    # Trajectories executed after switching to SE3.
    circle_radius_m: 2.0
    circle_angular_velocity_radps: 0.5
    circle_loops: 1.0
    figure8_radius_m: 2.0
    figure8_angular_velocity_radps: 0.5
    figure8_loops: 1.0

    preflight_wait_s: 30.0
    server_wait_s: 20.0
    action_timeout_s: 240.0
    lifecycle_timeout_s: 10.0

    # In-flight switch diagnostics.
    post_takeoff_settle_s: 2.0
    post_switch_validate_s: 8.0
    switch_controller_1: "control_manager::Se3Controller"
    switch_controller_2: "control_manager::Px4PassthroughController"
    enable_third_switch: true
    switch_controller_3: "control_manager::Se3Controller"
    require_airborne_after_switch: true
