repeats: 2
wait_between_runs_s: 2.0
cases:
  - name: passthrough
    base_manager_yaml: /ros2_ws/src/peregrine_core/examples/hardware_abstraction_example/config/example10_managers.yaml
    base_mission_yaml: /ros2_ws/src/peregrine_core/examples/hardware_abstraction_example/config/circle_figure8_mission.yaml

  - name: se3_current
    base_manager_yaml: /ros2_ws/src/peregrine_core/examples/hardware_abstraction_example/config/example10_se3_managers.yaml
    base_mission_yaml: /ros2_ws/src/peregrine_core/examples/hardware_abstraction_example/config/circle_figure8_se3_mission.yaml

  - name: se3_attitude_tighter
    base_manager_yaml: /ros2_ws/src/peregrine_core/examples/hardware_abstraction_example/config/example10_se3_managers.yaml
    base_mission_yaml: /ros2_ws/src/peregrine_core/examples/hardware_abstraction_example/config/circle_figure8_se3_mission.yaml
    manager_overrides:
      /**.ros__parameters.se3.k_R: [6.0, 6.0, 2.4]
      /**.ros__parameters.se3.k_omega: [1.1, 1.1, 0.45]
      /**.ros__parameters.se3.k_Ri: [0.04, 0.04, 0.02]

  - name: se3_xy_tighter
    base_manager_yaml: /ros2_ws/src/peregrine_core/examples/hardware_abstraction_example/config/example10_se3_managers.yaml
    base_mission_yaml: /ros2_ws/src/peregrine_core/examples/hardware_abstraction_example/config/circle_figure8_se3_mission.yaml
    manager_overrides:
      /**.ros__parameters.se3.k_p: [8.8, 8.8, 8.0]
      /**.ros__parameters.se3.k_v: [5.4, 5.4, 5.0]
      /**.ros__parameters.se3.k_i: [0.18, 0.18, 0.6]

  - name: se3_xy_and_attitude_tighter
    base_manager_yaml: /ros2_ws/src/peregrine_core/examples/hardware_abstraction_example/config/example10_se3_managers.yaml
    base_mission_yaml: /ros2_ws/src/peregrine_core/examples/hardware_abstraction_example/config/circle_figure8_se3_mission.yaml
    manager_overrides:
      /**.ros__parameters.se3.k_p: [8.8, 8.8, 8.0]
      /**.ros__parameters.se3.k_v: [5.4, 5.4, 5.0]
      /**.ros__parameters.se3.k_i: [0.18, 0.18, 0.6]
      /**.ros__parameters.se3.k_R: [6.0, 6.0, 2.4]
      /**.ros__parameters.se3.k_omega: [1.1, 1.1, 0.45]
      /**.ros__parameters.se3.k_Ri: [0.04, 0.04, 0.02]
