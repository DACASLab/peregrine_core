# Apply to namespaced frame_transformer nodes (e.g. /uav1/frame_transformer).
/**:
  ros__parameters:
    # Centered on current multi-UAV SITL fleet GNSS centroid (4-UAV square spawn).
    home_lat_deg: 47.397971
    home_lon_deg: 8.546164
    home_init_timeout_s: 90.0

uav_manager:
  ros__parameters:
    dependency_startup_timeout_s: 5.0
    data_readiness_timeout_s: 45.0

safety_monitor:
  ros__parameters:
    command_land_enabled: true
    land_command_timeout_s: 6.0
    land_command_retry_count: 3
