/**:
  ros__parameters:
    # GPS quality thresholds — used by safety_monitor (continuous flight safety).
    # NOTE: frame_transforms no longer uses GPS/home for frames; it anchors to PX4's
    # FrameAnchor (ref_*) instead. World placement is via world_datum_* (see below /
    # world-frame-anchoring-plan.md), shared identically across the fleet.
    gps:
      min_fix_type: 3
      min_satellites: 6
      max_hdop: 5.0
      max_vdop: 5.0
