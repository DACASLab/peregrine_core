/**:
  ros__parameters:
    # GPS home origin (Bangalore, India).
    home_lat_deg: 13.018526
    home_lon_deg: 77.565041

    # Shared GPS quality thresholds — used by both frame_transforms (home origin
    # init gate) and safety_monitor (continuous flight safety). Change here to
    # keep both nodes in sync.
    gps:
      min_fix_type: 3
      min_satellites: 6
      max_hdop: 5.0
      max_vdop: 5.0
