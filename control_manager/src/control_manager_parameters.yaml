control_manager:
  frame_prefix:
    type: string
    default_value: ""
    description: "TF frame name prefix for multi-UAV (e.g. uav1). Used to label the per-UAV base_link frame on body-rate outputs."
    read_only: true

  publish_rate_hz:
    type: double
    default_value: 250.0
    description: "Control output publication rate"
    read_only: true
    validation:
      gt<>: [0.0]

  status_rate_hz:
    type: double
    default_value: 5.0
    description: "Manager health status publication rate"
    read_only: true
    validation:
      gt<>: [0.0]

  state_timeout_s:
    type: double
    default_value: 0.5
    description: "Input data staleness threshold before reporting unhealthy"
    read_only: true
    validation:
      gt<>: [0.0]

  auto_start:
    type: bool
    default_value: true
    description: "Auto-configure and activate on startup"
    read_only: true

  controller_type:
    type: string
    default_value: "control_manager::Px4PassthroughController"
    description: "Fully qualified class name of the controller plugin to load"
    read_only: false
