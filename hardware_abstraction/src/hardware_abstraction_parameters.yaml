hardware_abstraction:
  px4_namespace:
    type: string
    default_value: ""
    description: "PX4 topic namespace prefix (e.g. /px4_1 for multi-instance SITL)"
    read_only: true

  target_system_id:
    type: int
    default_value: 1
    description: "MAV_SYS_ID of the PX4 instance this stack commands (instance N -> N+1)"
    read_only: true
    validation:
      bounds<>: [0, 255]

  frame_prefix:
    type: string
    default_value: ""
    description: "TF frame name prefix for multi-UAV (e.g. uav1)"
    read_only: true

  sensor_gps_topic_suffix:
    type: string
    default_value: "/fmu/out/vehicle_gps_position"
    description: "PX4 SensorGps topic suffix under px4_namespace"
    read_only: true

  world_frame:
    type: string
    default_value: "world"
    description: "Shared, fleet-wide world frame id (NOT namespaced). z=0 anchored to ground datum."
    read_only: true

  world_datum_set:
    type: bool
    default_value: false
    description: "If true, place this UAV's map in world using world_datum_*; else world==map horizontally (single-agent)."
    read_only: true

  world_datum_lat:
    type: double
    default_value: 0.0
    description: "Shared fleet world-datum latitude (deg). Must be identical across the fleet."
    read_only: true

  world_datum_lon:
    type: double
    default_value: 0.0
    description: "Shared fleet world-datum longitude (deg). Must be identical across the fleet."
    read_only: true

  world_datum_alt:
    type: double
    default_value: 0.0
    description: "Shared fleet world-datum altitude (AMSL m). Must be identical across the fleet."
    read_only: true

  offboard_rate_hz:
    type: double
    default_value: 20.0
    description: "Offboard control mode publication rate"
    read_only: true
    validation:
      gt<>: [0.0]

  status_rate_hz:
    type: double
    default_value: 5.0
    description: "PX4Status publication rate"
    read_only: true
    validation:
      gt<>: [0.0]

  connection_timeout_s:
    type: double
    default_value: 1.0
    description: "Maximum telemetry silence before marking PX4 disconnected"
    read_only: true
    validation:
      gt<>: [0.0]

  local_position_eph_threshold_m:
    type: double
    default_value: 5.0
    description: "Max horizontal position error (eph, m) for local_position_valid. Mirror of PX4 COM_POS_FS_EPH; keep in sync with the airframe's value. Widened 2.5x by hysteresis once valid."
    read_only: true
    validation:
      gt<>: [0.0]

  local_position_timeout_s:
    type: double
    default_value: 1.0
    description: "Max age of the last VehicleLocalPosition sample before local_position_valid is forced false (staleness guard)."
    read_only: true
    validation:
      gt<>: [0.0]
